<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Converted File
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Kone.ico') }}">
  </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #c4f0ed;
      text-align: center;
      padding: 50px;
    }
    .container {
      background: rgb(206, 244, 224);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
      display: inline-block;
    }
    h1 {
      color: #38c5b9;
    }
    h2 {
      color: #26ae46;
    }
    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 35px;
      background-color: #28a745;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
    }
    .download-btn:hover {
      background-color: #218838;
    }
    .clear-btn {
      margin-top: 25px;
      padding: 12px 30px;
      background-color: #ff4d4d;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .clear-btn:hover {
      background-color: #cc0000;
    }
    a {
      text-decoration: none;
      color: #007bff;
      display: block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>KTS Tech Solutions</h1>
    <h2>✅ Conversion Successful!</h2>
    <p>Your file has been successfully converted.</p>

    <!-- Download button -->
    <a href="{{ url_for('download', file_name=file_name) }}" class="download-btn" download>
      ⬇️ Download File
    </a>

    <!-- Clear Files button -->
    <form action="/clear" method="post">
      <button type="submit" class="clear-btn" onclick="return confirm('Are you sure you want to clear all files from admin storage?');">
        🧹 Clear Admin Files
      </button>
    </form>

    <!-- Back link -->
    <a href="/">⬅️ Convert Another File</a>
  </div>
</body>
</html>
