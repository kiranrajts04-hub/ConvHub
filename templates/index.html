<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Converter
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Kone.ico') }}">

  </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #feffff;
      text-align: center;
      padding: 60px;
    }
    .container {
      background: rgb(219, 240, 229);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
      display: inline-block;
    }
    h1 {
      color: #53d7c7af;
    }
    h2 {
      color: #3c52f3af;
    }
    select, input[type=file] {
      width: 80%;
      margin: 15px 0;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 15px 35px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="{{ url_for('static', filename='Kone.png') }}" alt="Kone Image" width="150">
    <h2>Smart File Converter</h2>
    <p>Select a file and choose the conversion type.</p>

    <form action="/convert" method="post" enctype="multipart/form-data">
      <input type="file" name="file" required><br>
      <select name="conversion_type" required>
        <option value="">-- Select Conversion Type --</option>
        <option value="jpg_to_pdf">JPG → PDF</option>
        <option value="png_to_pdf">PNG → PDF</option>
        <option value="pdf_to_jpg">PDF → JPG</option>
        <option value="word_to_pdf">Word → PDF</option>
        <option value="pdf_to_word">PDF → Word</option>
        <option value="ppt_to_pdf">PPT → PDF</option>
        <option value="pdf_to_ppt">PDF → PPT</option>
      </select><br>
      <button type="submit">Convert</button>
    </form>
  </div>
</body>
</html>
